<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 280" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2ba54" />
      <stop offset="45%" stop-color="#c59b27" />
      <stop offset="100%" stop-color="#8b6508" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4d0" />
      <stop offset="100%" stop-color="#d4af37" />
    </linearGradient>
  </defs>

  <g transform="translate(130, 15)">
    <!-- Ribbon Bow Top -->
    <path d="M90 45 C70 20, 90 15, 100 40 C110 15, 130 20, 110 45 Z" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Gift Box Lid -->
    <path d="M60 55 L140 55 L135 73 L65 73 Z" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Gift Box Body -->
    <path d="M70 73 L74 130 C74 135, 126 135, 126 130 L130 73" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Center Vertical Ribbon -->
    <path d="M100 55 L100 133" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round"/>
    
    <!-- Celestial Orbital Swoosh -->
    <path d="M45 125 C 35 165, 100 170, 155 120 C 175 100, 178 70, 155 60" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Four Celestial Sparkles -->
    <!-- Top Right Sparkle -->
    <path d="M165 35 Q165 48 178 48 Q165 48 165 61 Q165 48 152 48 Q165 48 165 35 Z" fill="url(#sparkleGrad)" />
    <!-- Left Sparkle -->
    <path d="M35 95 Q35 103 43 103 Q35 103 35 111 Q35 103 27 103 Q35 103 35 95 Z" fill="url(#sparkleGrad)" />
    <!-- Bottom Right Sparkle -->
    <path d="M152 118 Q152 125 159 125 Q152 125 152 132 Q152 125 145 125 Q152 125 152 118 Z" fill="url(#sparkleGrad)" />
    <!-- Small Bottom Sparkle -->
    <path d="M125 148 Q125 152 129 152 Q125 152 125 156 Q125 152 121 152 Q125 152 125 148 Z" fill="url(#sparkleGrad)" />
  </g>

  <!-- TYPOGRAPHY TEXT -->
  <g transform="translate(10, 245)">
    <!-- "Astro" in Dark Brown -->
    <text x="10" y="0" font-family="'Dancing Script', 'Great Vibes', cursive" font-size="102" font-weight="700" fill="#2c1510" letter-spacing="-2">Astro</text>
    
    <!-- Signature extended stroke for 'A' -->
    <path d="M 0 -12 C 10 -12, 105 -12, 125 -12" stroke="#2c1510" stroke-width="4.5" stroke-linecap="round"/>

    <!-- "Gifts" in Gold Gradient -->
    <text x="245" y="0" font-family="'Dancing Script', 'Great Vibes', cursive" font-size="102" font-weight="700" fill="url(#goldGrad)" letter-spacing="-1">Gifts</text>
  </g>
</svg>
